[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-financial-digital-twin"
version = "0.1.0"
description = "Synthetic, auditable bank stress simulation prototype"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "networkx", "simpy", "plotly", "pyyaml", "openai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

